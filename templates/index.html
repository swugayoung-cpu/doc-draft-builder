<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대학 행정 업무 문서 초안 생성기</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div class="header-content">
        <img
          src="{{ url_for('static', filename='images/suwon_logo.png') }}"
          alt="수원대학교 로고"
          class="header-logo"
        >
        <div class="header-text">
          <h1>대학 행정 업무 문서 초안 생성기</h1>
          <p class="subtitle">문서 종류와 핵심 사실만 입력하면 AI가 업무 문서 초안을 작성해 줍니다.</p>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="panel input-panel">
        <div class="panel-header">
          <h2>1. 문서 정보 입력</h2>
          <div class="result-actions">
            <button type="button" id="load-facts-btn" class="secondary-btn">불러오기</button>
            <button type="button" id="fill-sample-btn" class="secondary-btn">예시 채우기</button>
          </div>
        </div>

        <form id="draft-form" novalidate>
          <div class="form-row two-col">
            <div class="form-group">
              <label for="doc-type">문서 종류 <span class="required">*</span></label>
              <select id="doc-type" name="doc_type" required>
                <option value="">-- 선택하세요 --</option>
                <option value="보도자료">보도자료</option>
                <option value="안내문">안내문</option>
                <option value="기안문">기안문</option>
                <option value="결과 보고">결과 보고</option>
                <option value="업무 메일">업무 메일</option>
              </select>
            </div>

            <div class="form-group">
              <label for="tone">어조</label>
              <select id="tone" name="tone">
                <option value="공식적">공식적</option>
                <option value="친근한">친근한</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="title">제목 <span class="required">*</span></label>
            <input
              type="text"
              id="title"
              name="title"
              placeholder="예: 2026학년도 2학기 장학금 신청 안내"
              required
            >
          </div>

          <div class="form-group">
            <label for="recipient">받는 사람</label>
            <input
              type="text"
              id="recipient"
              name="recipient"
              placeholder="예: 학부 재학생 전체 / 각 단과대학 행정실"
            >
          </div>

          <fieldset class="fact-card">
            <legend>핵심 사실 카드 (비워둔 칸은 그대로 전송됩니다)</legend>
            <div class="fact-grid">
              <div class="form-group">
                <label for="date-time">일시</label>
                <input type="text" id="date-time" name="date_time" placeholder="예: 2026. 11. 25.(수) 14:00">
              </div>
              <div class="form-group">
                <label for="location">장소</label>
                <input type="text" id="location" name="location" placeholder="예: 본관 3층 대강당">
              </div>
              <div class="form-group">
                <label for="target">대상</label>
                <input type="text" id="target" name="target" placeholder="예: 전체 학부생 및 대학원생">
              </div>
              <div class="form-group">
                <label for="how-to-apply">신청 방법</label>
                <input type="text" id="how-to-apply" name="how_to_apply" placeholder="예: 학교 포털 온라인 신청">
              </div>
              <div class="form-group full-width">
                <label for="contact">문의처</label>
                <input type="text" id="contact" name="contact" placeholder="예: 학생지원팀 (02-1234-5678)">
              </div>
            </div>
          </fieldset>

          <div class="form-group">
            <span class="label-text">작성 방식 (Prompt 선택)</span>
            <div class="prompt-options">
              <label class="radio-card">
                <input type="radio" name="prompt_type" value="A" checked>
                <div>
                  <strong>Prompt A (기본)</strong>
                  <small>입력한 정보만으로 자유롭게 초안을 작성합니다.</small>
                </div>
              </label>
              <label class="radio-card">
                <input type="radio" name="prompt_type" value="B">
                <div>
                  <strong>Prompt B (행정 체크리스트)</strong>
                  <small>6하원칙·정중한 문체·문의처를 점검하고, 없는 내용은 [확인 필요]로 표시합니다.</small>
                </div>
              </label>
            </div>
          </div>

          <div id="error-message" class="alert error hidden" role="alert"></div>

          <button type="submit" id="generate-btn" class="primary-btn">초안 생성</button>
        </form>
      </section>

      <section class="panel result-panel">
        <div class="result-header">
          <h2>2. 생성된 초안</h2>
          <div class="result-actions">
            <button type="button" id="copy-btn" class="secondary-btn" disabled>복사</button>
            <button type="button" id="download-btn" class="secondary-btn" disabled>.md 다운로드</button>
          </div>
        </div>

        <div id="loading-indicator" class="loading hidden">생성 중...</div>
        <div id="status-message" class="status-message hidden"></div>

        <div class="view-tabs">
          <button type="button" id="tab-preview" class="tab-btn active">미리보기 (읽기 좋게 보기)</button>
          <button type="button" id="tab-edit" class="tab-btn">직접 수정 (편집)</button>
        </div>

        <div id="draft-preview" class="draft-preview">여기에 생성된 문서 초안이 표시됩니다.</div>
        <textarea
          id="draft-editor"
          class="draft-editor hidden"
          placeholder="여기에 생성된 문서 초안을 직접 수정할 수 있습니다."
        ></textarea>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}?v=4"></script>
</body>
</html>
